<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop Wigs | Hairstyled by Marisa</title><link rel="stylesheet" href="/shop.css"><style>
.wig-intro{padding:clamp(22px,6vw,48px);background:radial-gradient(ellipse at 95% 5%,#743b58,#251829 75%)}
.wig-inventory{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),min(48%,240px)));gap:16px}
.wig-card{overflow:hidden;padding:0}
.wig-card button.wig-open{display:block;margin:0;padding:0;border:0;border-radius:0;width:100%;background:none;text-align:left;color:inherit}
.wig-dialog{width:min(96vw,560px);max-height:94dvh;padding:0;overflow:auto;background:#241924;color:#fff1f7;border:1px solid #89516e;border-radius:17px}
.wig-dialog::backdrop{background:#140f15cc}
.wig-dialog img{display:block;width:100%;height:auto}
.wig-dialog-copy{padding:16px}
.wig-dialog .dialog-close{position:sticky;top:0;z-index:1;display:flex;justify-content:flex-end;margin:0;height:0;padding:12px 12px 0;pointer-events:none}
.wig-dialog .dialog-close button{pointer-events:auto}
.wig-details .open-label{display:block;margin-top:8px;color:#f5a7ce;font-size:13px}
.wig-details .wig-name{display:block;font:400 clamp(19px,4vw,26px) Georgia,serif}
.wig-card .display{aspect-ratio:1;background:radial-gradient(ellipse at center,#651943,#231526 78%)}
.wig-card .display img{display:block;width:100%;height:100%;object-fit:contain}
.wig-details{padding:16px}
.wig-details h2{font-size:clamp(25px,5vw,33px);margin:0}
.wig-details .wig-specs{display:flex;align-items:baseline;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;margin-top:8px}
.wig-specs strong{color:#f5a7ce;font-size:20px}
</style></head><body><main><header><a href="/">Hairstyled by Marisa</a><nav aria-label="Shop"><a href="/wigs.html">Wigs</a><a href="/custom-extensions.html">Custom Extensions</a></nav></header><section class="panel wig-intro"><h1>Shop <em>Wigs</em></h1><div class="links"><a class="cta" href="/custom-extensions.html?interest=wig#inquiry">Request a wig quote</a></div></section>
<section class="wig-inventory" aria-label="Wig inventory">
  <article class="panel wig-card" aria-labelledby="pink-leopard">
    <button class="wig-open" id="open-leopard" type="button" aria-haspopup="dialog" aria-labelledby="pink-leopard leopard-action">
      <span class="display" id="pink-leopard-display" style="display:block"><img src="/pink-leopard-wig.png" alt="Pink leopard wig on a gold stand and glowing pink platform"></span>
      <span class="wig-details" style="display:block">
        <span class="wig-name" id="pink-leopard">Pink Leopard</span>
        <span class="wig-specs"><span>30″ · Human hair</span><strong>$300</strong></span>
        <span class="open-label" id="leopard-action">View details ↗</span>
      </span>
    </button>
  </article>
</section>
<dialog class="wig-dialog" id="leopard-details" aria-labelledby="leopard-title">
  <form method="dialog" class="dialog-close"><button type="submit" class="secondary" autofocus>Close</button></form>
  <img src="/pink-leopard-wig.png" alt="Full view of the pink leopard wig on its glowing display">
  <div class="wig-dialog-copy">
  <h2 id="leopard-title">Pink Leopard</h2>
  <p>Long pink hair with bold leopard spots.</p>
  <dl><dt>Length</dt><dd>30 inches</dd><dt>Hair</dt><dd>Human hair</dd><dt>Price</dt><dd>$300</dd></dl>
  <a class="cta" href="/custom-extensions.html?interest=wig&amp;design=Pink%20Leopard#inquiry">Inquire about Pink Leopard</a>
  </div>
</dialog><script>
const dialog = document.getElementById('leopard-details');
document.getElementById('open-leopard').onclick = () => dialog.showModal();
</script></main></body></html>
