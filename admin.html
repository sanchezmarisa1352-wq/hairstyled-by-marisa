<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Marisa | Private Studio</title><style>body{background:#140e15;color:#f8e9f1;font:16px system-ui;margin:0;padding:24px}main{max-width:850px;margin:auto}h1{color:#f7a8cc}section,article{background:#241923;border:1px solid #654052;border-radius:16px;padding:20px;margin:16px 0}input,button,select{font:inherit;padding:12px;border-radius:9px;margin:5px;background:#362431;color:white;border:1px solid #a76a89}button{background:#f7a8cc;color:#241923;cursor:pointer}input{max-width:85%}small{color:#d4b6c7}[hidden]{display:none!important}input,button,select,article,section{box-sizing:border-box}
label{display:inline-block}article{overflow-wrap:anywhere}.months{display:flex;align-items:center;justify-content:space-between}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;gap:3px}
.calendar button{padding:6px 1px;margin:0;min-height:44px;background:#362431;color:white}.calendar button[aria-pressed=true]{background:#f7a8cc;color:#241923}
.calendar small{display:block}button:disabled{opacity:.6}#message{min-height:1.5em}
@media(max-width:500px){body{padding:12px}section,article{padding:12px}.calendar button{font-size:14px}}
</style><main><small>HAIRSTYLED BY MARISA · PRIVATE STUDIO</small><h1>Appointment dashboard</h1><section id="login"><form id="form"><label>Email <input id="email" type="email" placeholder="Email" required autocomplete="username"></label><label>Password <input id="password" type="password" placeholder="Password" required autocomplete="current-password"></label><button>Sign in</button></form><button id="magic">Email me a sign-in link</button></section><section id="dash" hidden><button id="refresh">Refresh requests</button><button id="logout">Sign out</button><h2>Calendar</h2>
<div class="months"><button id="back" aria-label="Previous month">‹</button><strong id="month"></strong><button id="forward" aria-label="Next month">›</button></div>
<div id="calendar" class="calendar"></div><button id="all-days">Show entire month</button>
<h2>Availability</h2>
<form id="block">
<label>Date <input name="day" type="date" required></label>
<label>Start, Pacific <input name="time" type="time" value="10:00" required></label>
<label>Minutes <input name="duration" type="number" min="15" max="1440" value="540" required></label>
<button>Block time</button></form>
<h2 id="list-title">Appointment requests</h2><div id="requests"></div></section><p id="message" role="status"></p></main><script type="module" src="/studio/admin.js"></script></html>
