<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marisa | Private Studio</title><style>body{background:#140e15;color:#f8e9f1;font:16px system-ui;margin:0;padding:24px}main{max-width:850px;margin:auto}h1{color:#f7a8cc}section,article{background:#241923;border:1px solid #654052;border-radius:16px;padding:20px;margin:16px 0}input,button,select{font:inherit;padding:12px;border-radius:9px;margin:5px;background:#362431;color:white;border:1px solid #a76a89}button{background:#f7a8cc;color:#241923;cursor:pointer}input{max-width:85%}small{color:#d4b6c7}</style><main><small>HAIRSTYLED BY MARISA · PRIVATE STUDIO</small><h1>Appointment dashboard</h1><section id="login"><form id="form"><input id="email" type="email" placeholder="Email" required autocomplete="username"><input id="password" type="password" placeholder="Password" required autocomplete="current-password"><button>Sign in</button></form><button id="magic">Email me a sign-in link</button></section><section id="dash" hidden><button id="refresh">Refresh requests</button><button id="logout">Sign out</button><h2>Appointment requests</h2><div id="requests"></div></section><p id="message" role="status"></p></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm';const s=createClient('https://lfnthpzffdfnhysqtitb.supabase.co','sb_publishable_XT9dhSJTw7Jlh-yZxFBjTA_Yijruhz3');const $=id=>document.getElementById(id),msg=t=>$('message').textContent=t;async function load(){const {data,error}=await s.from('lola_requests').select('*').order('created_at',{ascending:false});if(error){msg(error.message);return}const root=$('requests');root.replaceChildren();if(!data.length)root.textContent='No requests yet.';for(const r of data){const a=document.createElement('article');for(const [k,v] of Object.entries({Client:r.client_name,Contact:r.contact,Services:r.service,'Requested time':r.preferred_time,Notes:r.notes,Status:r.status})){const p=document.createElement('p');p.textContent=k+': '+(v??'');a.append(p)}for(const status of ['pending','contacted','closed']){const b=document.createElement('button');b.textContent=status;b.onclick=async()=>{const {error}=await s.from('lola_requests').update({status}).eq('id',r.id);if(error)msg(error.message);else load()};a.append(b)}root.append(a)}}async function show(){const {data:{user}}=await s.auth.getUser();const ok=user?.id==='0b27059d-4e2a-4f49-a8fb-a2355a88909a';$('login').hidden=ok;$('dash').hidden=!ok;if(ok)load();else if(user)msg('Not authorized.')} $('form').onsubmit=async e=>{e.preventDefault();const {error}=await s.auth.signInWithPassword({email:$('email').value,password:$('password').value});msg(error?.message||'');show()};$('magic').onclick=async()=>{const {error}=await s.auth.signInWithOtp({email:$('email').value,options:{shouldCreateUser:false,emailRedirectTo:location.origin+'/admin.html'}});msg(error?.message||'Check your email for a sign-in link.')};$('logout').onclick=async()=>{await s.auth.signOut();$('requests').replaceChildren();show()};$('refresh').onclick=load;show();</script></html>
